name: Verify Engine Code

on:
  pull_request:
  push:
    paths:
    - '.github/workflows/engine.yml'
    - 'package.json'
    - 'package-lock.json'
    - 'src/**'
    - 'tools/**'
    # The quest helper's table is checked here and is generated, not hand-edited, so a change to
    # it arrives on its own with nothing else to trigger this run.
    - 'data/quests.json'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm

    - run: npm ci

    - name: Lint
      run: npm run lint

    - name: Compile
      run: npx tsc --noEmit

    # Every setting in Environment reads the variable it is named after. A wrong name compiles,
    # lints, and holds a plausible value - the only symptom is that setting it in .env does
    # nothing. Two had drifted, one of them reachable from a line .env.example invites you to
    # uncomment.
    - name: Environment names
      run: npx tsx tools/envcheck.ts

    # The trading post's escrow rules against a real in-memory SQLite: every scenario adds up every
    # coin and item before and after, so a dupe or a void fails it whatever the code path.
    - name: Trading post
      run: npx tsx tools/tradingpostcheck.ts

    # Every row of the quest helper's table is a sentence a player reads in the game, and the
    # sentences are generated out of sim prose and server debugnames. This asserts the shapes that
    # cannot be right - a handle showing through, a step with no verb, "Use an item on Cauldron" -
    # over the whole shipped table rather than over a few examples.
    - name: Quest helper wording
      run: npx tsx tools/quest/WordingCheck.ts
