name: Verify Engine Code

on:
  pull_request:
  push:
    paths:
    - '.github/workflows/engine.yml'
    - 'package.json'
    - 'package-lock.json'
    - 'src/**'
    - 'tools/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm

    - run: npm ci

    - name: Lint
      run: npm run lint

    - name: Compile
      run: npx tsc --noEmit

    # The trading post's escrow rules against a real in-memory SQLite: every scenario adds up every
    # coin and item before and after, so a dupe or a void fails it whatever the code path.
    - name: Trading post
      run: npx tsx tools/tradingpostcheck.ts
