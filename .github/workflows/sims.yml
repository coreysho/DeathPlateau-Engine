# The 298 pass/fail simulations in tools/sim, which nothing ran automatically.
#
# WHY NOT ON EVERY PUSH. They are about two and a half hours end to end - each boots a world,
# and the audit sweeps are minutes each - against four minutes for the whole of the client's
# test suite. Sharded eight ways that is about twenty-five minutes of wall clock, which is fine
# overnight and is not fine on a push.
#
# WHY A KNOWN-FAILING LIST. Twenty per cent of them fail today, for three different reasons:
# some read '../content' and are looking at the wrong checkout, some test content that is not
# on this branch at all - marksofgrace wants a varp named mark_grace_cooldown that exists
# nowhere in the content - and some are genuinely failing checks worth fixing. A job that is
# red every night is a job nobody reads, so tools/sim/known-failing.txt holds the ones already
# broken when this was switched on, and a shard goes red only for a sim that is NOT on it. A
# sim that starts passing is reported too: it should come off the list, or the list rots into
# an excuse.
#
# CONTENT IS CHECKED OUT AS 'content' AND NOT UNDER ITS REPOSITORY NAME, because thirty of the
# sims open '../content/scripts/...' directly. That is their convention and this matches it.
name: Nightly sims

on:
  schedule:
    # 03:00 UTC, off the hour everything else in this project uses. GitHub delays scheduled runs
    # under load and is not shy about it - the first unattended run fired at 10:28.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      content_ref:
        # WHY THIS IS AN INPUT. Both jobs below check the content out at a fixed 377-wip, which is
        # right for the nightly and wrong for a branch: an engine change and the content change it
        # goes with live on two branches in two repositories, and pinning one of them means the run
        # measures a pair that will never ship together.
        #
        # It cost a cancelled run to find out. A branch here fixed Desert Treasure's obelisks in the
        # CONTENT repository and the sims were still run against 377-wip, so audit3 would fail on
        # exactly the bug that was fixed, and the ratchets - whose baselines had been rebuilt from
        # the new content - would report seventy-eight orphans that no longer exist.
        #
        # Defaulted to 377-wip, so the scheduled run is unchanged.
        description: 'Content branch to run against'
        type: string
        default: '377-wip'
      notify_test:
        # A WAY TO PROVE THE DISCORD SECRET WORKS without waiting for a bad night or faking a
        # broken sim. Testing the webhook URL by hand proves the URL works; it does NOT prove
        # the repository secret is right, which is where a typo, a stray newline or a truncated
        # paste actually lands. This runs the notify job alone, against the real secret.
        description: 'Post a test message to Discord and skip the sims'
        type: boolean
        default: false

jobs:
  sims:
    name: sims ${{ matrix.shard }} of 8
    if: ${{ !inputs.notify_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
    - uses: actions/checkout@v4
      with:
        path: engine

    - uses: actions/checkout@v4
      with:
        repository: coreysho/DeathPlateau-Content
        # `|| '377-wip'` and not the input alone: a scheduled run carries no inputs, so
        # github.event.inputs.content_ref is empty there rather than defaulted.
        ref: ${{ github.event.inputs.content_ref || '377-wip' }}
        path: content

    # AND THE CLIENT, because two sims check that the client and the server still agree about the
    # wire. varpbatch reads Protocol.java's SERVERPROT_LENGTH table to prove the client has a
    # length for the batched-varp opcode the server now writes - get that wrong and every player
    # desyncs at login. Without this checkout the sim cannot read the file and dies, which is how
    # it turned up as "newly failing" on the first unattended night.
    #
    # The path is a SIBLING OF engine/, not under it: the sims default to '../DeathPlateau-Client'
    # and run with engine/ as their working directory.
    #
    # dev-logging ON PURPOSE. It is the branch the launcher ships, so this compares the server
    # against the client players are actually running, which is the disagreement that matters.
    - uses: actions/checkout@v4
      with:
        repository: coreysho/DeathPlateau-Client
        ref: dev-logging
        path: DeathPlateau-Client

    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: engine/package-lock.json

    - name: Install
      working-directory: engine
      run: npm ci

    # IN THE LOG, because a red verdict is unreadable without it: the same engine commit passes or
    # fails depending on which content it was built against.
    - name: Which content this run used
      working-directory: content
      run: git log --oneline -1

    # Every shard packs its own cache. It is 45 seconds against the 25 minutes of sims behind
    # it, and sharing one through an artifact would make every shard wait on a job that packs.
    - name: Pack the content
      working-directory: engine
      env:
        BUILD_SRC_DIR: ../content
        BUILD_VERIFY: 'false'
      run: npx tsx tools/pack/Build.ts

    # EVERY SIM BOOTS A WORLD, and World refuses to start without a login key. It is a secret,
    # so it is gitignored and a fresh checkout has none - which is why the first run of this
    # job died in forty seconds with all 300-odd sims "failing" for one reason. A throwaway
    # key per run is right: nothing here signs anything a player will ever see.
    - name: A login key for this run
      working-directory: engine
      run: npx tsx tools/server/rsa.ts

    - name: Run this shard
      working-directory: engine
      run: |
        # NAMES ONLY: the list carries a comment per entry saying how it fails, which is the
        # point of it, so the names are cut out of it rather than matched against the line.
        # THE PER-SIM CAP, 360 AND NOT 180. seedstall passes all nine of its checks and takes
        # four minutes doing it: a hundred thefts, each with sixteen ticks of regrowth, which is
        # the measurement it exists to make. At 180 it was killed mid-run and filed as a failure
        # twice over, with a clean tally sitting in its log - sweep.sh already says the cap "is
        # there to catch a sim that has hung, not to race the slowest one", and this is the same
        # cap with the same job.
        #
        # It only costs wall clock on a sim that is ALREADY failing or slow, since a passing sim
        # exits on its own; the 90-minute job timeout above is the real ceiling.
        cap=360
        SKIP_IN_CI='pingwire'
        known=/tmp/known-failing-names.txt
        grep -oE '^[a-z0-9_]+' tools/sim/known-failing.txt > "$known" || : > "$known"
        echo "known-failing: $(wc -l < "$known") sims"
        newly_red=""
        newly_green=""
        flaky=""
        i=0
        for f in $(ls tools/sim/*.ts | sort); do
          # Only the ones that can actually report a verdict; the rest are hand-run tools.
          grep -qE 'process\.exit\([^0-9)]' "$f" || continue
          # AND NOT THE ONES THAT NEED A RUNNING GAME. This is not known-failing.txt: nothing is
          # broken here, the job simply cannot give these sims what they ask for, and recording
          # them as "failing" would be a lie that also hides a real failure if one ever appears.
          #   pingwire  opens a socket to a live server and fetches /crc0 off its web port
          case " $SKIP_IN_CI " in *" $(basename "$f" .ts) "*) continue ;; esac
          if [ $((i % 8)) -ne ${{ matrix.shard }} ]; then i=$((i + 1)); continue; fi
          i=$((i + 1))
          n=$(basename "$f" .ts)
          # A FEW ARE HONESTLY SLOW, and a sim killed at the cap looks exactly like a sim that
          # failed: no verdict line, just output that stops. glassblowing is 88 checks over
          # seventeen products and takes 216 seconds on a machine FASTER than a runner, so the
          # 180 second cap killed it and the job reported it as "fails twice". It was passing
          # all along. Its own cap rather than a bigger one for all 300, because a cap that
          # covers the slowest sim stops being a timeout at all.
          #
          # MEASURED, not guessed, on a machine faster than a runner: glassblowing 216s, gwdguards
          # 322s, audit1 357s, dpick 396s, gwdanims 433s. Each cap is roughly three times its own
          # measurement, which is headroom for a slower box and still a timeout rather than a
          # blank cheque. The cap is a ceiling, not a cost: a sim that finishes early costs what
          # it costs.
          case "$n" in
            glassblowing) cap=600 ;;
            gwdguards|audit1|dpick|gwdanims) cap=1200 ;;
            *) cap=180 ;;
          esac
          # TWO SIMS ASK FOR AN ENVIRONMENT AND SAY SO, and running them without it is how they
          # ended up on known-failing.txt under the heading "FAIL WITH NOTHING TO SAY". Neither is
          # broken: each prints its usage line and exits 1, which is correct of them and reads
          # here as a failure. Given what they ask for, securityfixes is 20 ok and staffrules is
          # 16 ok - thirty-six assertions that went unrun every night for want of two variables.
          #
          # NODE_PRODUCTION is what makes a world behave like a live one: staffrules is about the
          # owner rules on a real server, and securityfixes checks the save reaches disk before
          # the world exits. NODE_IDLE_LOGOUT_TICKS=20 is securityfixes's own - it tests the idle
          # logout and will not wait out the real one.
          env_for=""
          case "$n" in
            securityfixes) env_for="NODE_PRODUCTION=true NODE_IDLE_LOGOUT_TICKS=20" ;;
            staffrules) env_for="NODE_PRODUCTION=true" ;;
          esac
          rc=0
          env $env_for timeout "$cap" npx tsx "$f" > "/tmp/$n.log" 2>&1 || rc=$?
          if grep -qx "$n" "$known"; then
            if [ "$rc" = "0" ]; then
              echo "::notice title=$n::$n passes now and is still on known-failing.txt"
              newly_green="$newly_green $n"
            else
              # SHOW THE DEBT ITS OWN FAILURE. A listed sim used to fail in total silence, which
              # makes every entry on that list undiagnosable from CI: the only way to see why
              # changepassword fails on a runner and passes on a laptop was to take it OFF the
              # list and make the job red on purpose. The group is collapsed, so a quiet night
              # stays quiet and the reason is one click away when somebody wants it.
              echo "::group::$n (exit $rc, on known-failing.txt)"
              tail -20 "/tmp/$n.log"
              echo "::endgroup::"
            fi
            continue
          fi
          if [ "$rc" != "0" ]; then
            # ONCE MORE, AND IT SHOULD NEVER HELP. The retry went in when two dispatches of
            # the same commit disagreed about which sims failed, and it did not work: on the
            # run after it, droprate, gwdskirmish and rdreach each failed TWICE in a row,
            # while all three pass on a laptop. A retry cannot fix a suite that is sampling
            # the game rather than measuring it.
            #
            # The dice are seeded now (tools/sim/harness.ts, seedTheDice), so a sim run is
            # reproducible and this retry is no longer what keeps the list honest. It stays
            # as an INSTRUMENT: with the dice fixed, a FLAKY line means something still
            # varies between two runs of the same commit - a real bug worth chasing, not
            # noise to absorb. Only failures are retried, so a green run costs nothing.
            rc2=0
            timeout "$cap" npx tsx "$f" > "/tmp/$n.retry.log" 2>&1 || rc2=$?
            if [ "$rc2" = "0" ]; then
              echo "::notice title=$n::$n failed then passed on a retry - flaky, not counted"
              flaky="$flaky $n"
              continue
            fi
            echo "::group::$n (exit $rc, then $rc2 on retry)"
            tail -40 "/tmp/$n.retry.log"
            echo "::endgroup::"
            echo "::error title=$n::$n fails twice and is not on known-failing.txt"
            newly_red="$newly_red $n"
          fi
        done
        [ -n "$flaky" ] && echo "FLAKY, failed then passed:$flaky"
        [ -n "$newly_green" ] && echo "NOW PASSING, take them off the list:$newly_green"
        # WRITTEN DOWN BEFORE THE EXIT, so the notify job can name the sims rather than say
        # "a shard went red, go and read eight logs". The step dies on the next line when
        # anything is newly red, so anything this file is to carry has to be in it by now.
        mkdir -p /tmp/verdict
        {
          [ -n "$newly_red" ] && echo "red:${newly_red}"
          [ -n "$flaky" ] && echo "flaky:${flaky}"
          [ -n "$newly_green" ] && echo "green:${newly_green}"
        } > "/tmp/verdict/shard-${{ matrix.shard }}.txt" || :
        if [ -n "$newly_red" ]; then
          echo "NEWLY FAILING:$newly_red"
          exit 1
        fi
        echo "shard ${{ matrix.shard }}: nothing newly broken"

    # always(): the step above exits 1 on a red shard, and a red shard's verdict is the one
    # worth keeping.
    - name: Keep this shard's verdict
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verdict-${{ matrix.shard }}
        path: /tmp/verdict/
        if-no-files-found: ignore
        retention-days: 7

  # --------------------------------------------------------------------------- the three ratchets
  # tools/sim/opsweep.ts and tools/sim/orphans.ts cross-reference the cache against the script
  # table in both directions - an option with no script, and a script no option can fire - and
  # tools/sim/ifselect.ts asks the question neither of those can, which is whether a radio button's
  # handler stores the value its own highlight script says it should. Each is
  # about forty seconds for the whole game and each has a committed baseline, so they are ratchets:
  # a build that adds a dead option or an unreachable trigger fails here instead of waiting for a
  # playtest report.
  #
  # A SEPARATE JOB, not a shard. The sharded job above runs every sim bare, and bare these two
  # print a report and exit 0 - they only ratchet with --check, which no shard would pass. It also
  # means a red ratchet is legible on its own rather than buried in one shard of eight.
  #
  # AND NOT ON known-failing.txt EITHER. That list is for sims already broken when the nightly was
  # switched on; these two are green today by construction, because their baselines were written
  # from today's build.
  #
  # WHERE THIS REALLY BELONGS is the content repository's own push CI: a dead option is almost
  # always added by a content change, and its `pack` job already checks out both repositories and
  # builds the cache, so the two steps would drop straight in. What stops it is that the baselines
  # live HERE, so banking a deliberate new entry would need an engine pull request to go green -
  # which is the right friction for a ratchet and the wrong friction for somebody editing a .loc.
  # Nightly in this repository is the version that costs nobody anything.
  ratchets:
    name: no new dead options, unreachable triggers or mis-wired buttons
    # Skipped on a notifier test, the same way the sims job is: that dispatch exists to prove the
    # Discord secret, and packing a cache to prove it is two minutes of nothing. It also keeps
    # needs.ratchets.result at 'skipped' there rather than 'success', so the notify condition reads
    # the same for both jobs.
    if: ${{ !inputs.notify_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
      with:
        path: engine

    - uses: actions/checkout@v4
      with:
        repository: coreysho/DeathPlateau-Content
        # `|| '377-wip'` and not the input alone: a scheduled run carries no inputs, so
        # github.event.inputs.content_ref is empty there rather than defaulted.
        ref: ${{ github.event.inputs.content_ref || '377-wip' }}
        path: content

    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: engine/package-lock.json

    - name: Install
      working-directory: engine
      run: npm ci

    # IN THE LOG, because a red verdict is unreadable without it: the same engine commit passes or
    # fails depending on which content it was built against.
    - name: Which content this run used
      working-directory: content
      run: git log --oneline -1

    - name: Pack the content
      working-directory: engine
      env:
        BUILD_SRC_DIR: ../content
        BUILD_VERIFY: 'false'
      run: npx tsx tools/pack/Build.ts

    # Both tools boot a world, and World refuses to start without a login key - see the note on
    # the same step in the sims job.
    - name: A login key for this run
      working-directory: engine
      run: npx tsx tools/server/rsa.ts

    # --check exits 1 on anything NEW and prints it. Fixed entries are reported and do not fail:
    # banking them is a deliberate `--baseline` commit, not something CI should do by itself.
    - name: Options the cache offers that no script answers
      working-directory: engine
      env:
        BUILD_SRC_DIR: ../content
      run: npx tsx tools/sim/opsweep.ts --check

    - name: Triggers no click can fire
      if: always()
      working-directory: engine
      env:
        BUILD_SRC_DIR: ../content
      run: npx tsx tools/sim/orphans.ts --check

    # The third cross-reference, and the one that catches wiring that LOOKS right: a radio button
    # whose [if_button] handler stores a value the cache does not highlight on. Thessalia's
    # women's trousers window passed both tools above - every handler existed and every option it
    # answered existed - and still handed out the wrong trousers for six of its seven styles.
    - name: Radio buttons whose script disagrees with the cache
      if: always()
      working-directory: engine
      env:
        BUILD_SRC_DIR: ../content
      run: npx tsx tools/sim/ifselect.ts --check

  # ------------------------------------------------------------------ and the bots, which run nowhere else
  # WHY THIS JOB EXISTS. The ratchets above read the cache against the script table and find what was
  # never WRITTEN. They cannot find what BREAKS, because that needs somebody to be standing in the
  # right place holding the right thing - and the only thing in this project that does that is
  # src/engine/bot/BotFuzzer.ts, which until now ran only when somebody remembered to run it. Of the
  # two script faults it has ever found, one was real: an uncharged serpentine helm threw instead of
  # dropping, which no cross-reference tool can see because every option involved is wired.
  #
  # 99 BOTS AND 3,000 TICKS, measured and not guessed. The four runs that settled it:
  #
  #       8 bots x  3,000 ticks     166s    2.9% of triggers reached
  #      12 bots x 20,000 ticks   1,371s    7.8%
  #      14 bots x 25,000 ticks   1,862s    8.4%
  #      99 bots x  3,000 ticks     881s   10.4%   <- more coverage, half the wall clock
  #
  # 99 at 3,000 beats 14 at 25,000 on coverage AND time with fewer bot-ticks, because the fixed
  # per-tick world cost amortises across bots instead of repeating across ticks: 337 bot-ticks a
  # second against 175. Where they start makes no measurable difference (10.4% from bank spots,
  # 10.3% from the densest content squares), so no coordinate is passed and they spread.
  #
  # NO SEED PASSED EITHER, so the run uses fuzz.ts's own default. A fixed seed is the point: a fault
  # the nightly finds has to be reproducible by hand with the same command, and every finding prints
  # its own replay line.
  #
  # --gate IS WHAT MAKES IT RED, and only for what was measured to be zero at this configuration: a
  # script fault, and the corpse / coord / stat / varp / items watcher findings. Everything else the
  # run prints is a work queue rather than a verdict - the three "options nothing answered" buckets,
  # because notrigger is a strict subset of opsweep's and that is already ratcheted above so gating
  # it would fail the same bug twice; and SOFTLOCK, because the same run reports 18 of those and
  # they are bots parked at banks whose activity the watcher's fingerprint cannot see. fuzz.ts's own
  # header has the evidence for both exclusions.
  fuzz:
    name: the fuzzing bots find nothing new
    if: ${{ !inputs.notify_test }}
    runs-on: ubuntu-latest
    # 90 MINUTES FOR A 15 MINUTE RUN, and the generosity is deliberate. The 881s measurement is from
    # a box faster than a GitHub standard runner, and a hosted runner is two cores: the same work
    # could plausibly take three times as long here. A cap is a ceiling and not a cost - the job
    # ends when the run ends - whereas a fuzz run killed at the cap looks exactly like a fuzz run
    # that crashed, output that simply stops, which is the trap the sims job above documents for
    # glassblowing. The first unattended run is what will say how long this actually takes.
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4
      with:
        path: engine

    - uses: actions/checkout@v4
      with:
        repository: coreysho/DeathPlateau-Content
        ref: ${{ github.event.inputs.content_ref || '377-wip' }}
        path: content

    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: engine/package-lock.json

    - name: Install
      working-directory: engine
      run: npm ci

    - name: Which content this run used
      working-directory: content
      run: git log --oneline -1

    - name: Pack the content
      working-directory: engine
      env:
        BUILD_SRC_DIR: ../content
        BUILD_VERIFY: 'false'
      run: npx tsx tools/pack/Build.ts

    - name: A login key for this run
      working-directory: engine
      run: npx tsx tools/server/rsa.ts

    - name: 99 fuzzing bots for 3,000 ticks
      working-directory: engine
      # `shell: bash` AND NOT THE DEFAULT, which is the whole reason this line exists. A run step on
      # Linux defaults to `bash -e`, with no pipefail - so `tsx ... | tee` would report TEE's exit
      # status and a red fuzz run would pass silently. Naming bash explicitly gets
      # `bash --noprofile --norc -eo pipefail`, which fails on the left-hand side.
      shell: bash
      env:
        BUILD_SRC_DIR: ../content
      run: npx tsx tools/sim/fuzz.ts 3000 99 --gate 2>&1 | tee /tmp/fuzz.log

    # THE LOG IS THE DELIVERABLE EVEN ON A GREEN NIGHT. The run leaves a work queue behind - every
    # option nothing answered, the action histogram, and the trigger coverage - and all of it is in
    # temporary files that go with the runner. Kept for a fortnight, which is long enough to compare
    # two nights and short enough not to accumulate.
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fuzz-log
        path: /tmp/fuzz.log
        retention-days: 14

  # ------------------------------------------------------------------ and say so in Discord
  # WHY A WEBHOOK AND NOT THE GAME'S BOT. The engine talks to Discord through a bot token
  # (Environment.DISCORD_TOKEN, src/server/discord), which belongs to a running server and has
  # the run of its guild. This repository is PUBLIC. A per-channel incoming webhook can only
  # post to the one channel it was made for, so that is what CI gets.
  #
  # NO SECRET, NO POST, NO FAILURE. If DISCORD_WEBHOOK is not set the job prints the message it
  # would have sent and succeeds: a missing notification must not turn a green night red, and
  # printing it means this job can be proved to work before the secret exists.
  #
  # To switch it on: in Discord, the channel's Settings -> Integrations -> Webhooks -> New
  # Webhook, copy its URL, then in this repository Settings -> Secrets and variables ->
  # Actions -> New repository secret, named DISCORDWEBHOOK.
  #
  # NO UNDERSCORE, which is not a typo here. The secret was created as DISCORDWEBHOOK and a
  # secret cannot be renamed, only deleted and remade - so the workflow matches the secret
  # rather than making somebody paste the URL again. The shell variable below keeps the
  # readable spelling; only the ${{ secrets.* }} reference has to match GitHub exactly.
  notify:
    name: tell Discord
    needs: [sims, ratchets, fuzz]
    # needs.*.result rather than failure(), because on a notifier test both of those jobs are
    # SKIPPED and failure() would not fire. !cancelled() keeps it from speaking after a cancel.
    # Both jobs are named: a green sweep with a red ratchet is still a night worth hearing about.
    if: ${{ !cancelled() && (needs.sims.result == 'failure' || needs.ratchets.result == 'failure' || needs.fuzz.result == 'failure' || inputs.notify_test) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    # Nothing to download on a test, and v4 treats "no artifacts matched" as an error.
    - uses: actions/download-artifact@v4
      if: ${{ !inputs.notify_test }}
      with:
        pattern: verdict-*
        merge-multiple: true
        path: verdict

    - name: Post the failure
      env:
        # Quoted and read as an environment variable rather than interpolated into the script,
        # so the URL is never part of a command line and cannot land in the log.
        DISCORD_WEBHOOK: ${{ secrets.DISCORDWEBHOOK }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        TRIGGER: ${{ github.event_name }}
        SHA: ${{ github.sha }}
        RATCHETS: ${{ needs.ratchets.result }}
        FUZZ: ${{ needs.fuzz.result }}
        NOTIFY_TEST: ${{ inputs.notify_test }}
        # DIAGNOSTIC ONLY, and deliberately not used to send anything. 'Settings -> Secrets and
        # variables -> Actions' holds BOTH on one page, and "New repository variable" sits next to
        # "New repository secret", so a webhook in the wrong half is the likeliest reason for a
        # secret that reads empty. This says which half it is in without guessing twice.
        HAVE_VAR: ${{ vars.DISCORDWEBHOOK != '' }}
      run: |
        red=$(cat verdict/*.txt 2>/dev/null | sed -n 's/^red://p' | tr ' ' '\n' | sed '/^$/d' | sort -u | paste -sd' ' -)
        flaky=$(cat verdict/*.txt 2>/dev/null | sed -n 's/^flaky://p' | tr ' ' '\n' | sed '/^$/d' | sort -u | paste -sd' ' -)

        # A shard can also die without ever writing a verdict - the 90 minute timeout, a runner
        # going away, npm ci failing. Saying "no sims newly failing" there would be a lie, so
        # the message says it does not know rather than inventing a clean bill of health.
        #
        # AND THE RATCHETS CAN BE THE FAILURE. This job needs both, so a green sweep with a red
        # opsweep/orphans arrives here with no verdict files at all - which used to read as "a
        # shard died" and sent whoever got the message to look in the wrong place.
        if [ "$NOTIFY_TEST" = "true" ]; then
          # SAYS SO IN THE MESSAGE, loudly. A test that looks like a real failure is worse than
          # no test: somebody reads it at 3am and goes looking for a broken sim.
          title="Nightly sims: notifier test"
          colour=3066993
          body="This is a test of the failure notification. The sims did not run and nothing is broken."
        elif [ -n "$red" ]; then
          body="Newly failing: **${red}**"
        elif [ "$RATCHETS" != "success" ]; then
          body="The sims are fine. The ratchets are not: **opsweep/orphans** found a dead option or an unreachable trigger that is not in its baseline. The run log names it."
        elif [ "$FUZZ" != "success" ]; then
          # THE ONE THAT NEEDS NO FOLLOW-UP TO REPRODUCE. Every fuzz finding prints its own replay
          # line - seed, bot, tick and the last actions before it - and the command is fixed, so the
          # message can tell whoever reads it exactly what to type.
          body="The sims and the ratchets are fine. **The fuzzing bots are not**: a script fault or a watcher finding that is not meant to exist."$'\n'"Reproduce with \`npx tsx tools/sim/fuzz.ts 3000 99 --gate\` - the run log names it and prints its replay line. The full log is on the run as the **fuzz-log** artifact."
        else
          body="No shard reported a failing sim, so a shard died before it could - a timeout, the install, or the content checkout."
        fi
        [ -n "$flaky" ] && body="${body}"$'\n'"Flaky (failed, then passed on a retry): **${flaky}** - the dice are seeded, so this should never happen and means something still varies between two runs of one commit."

        # jq builds the JSON so a sim name or a message can never break the payload.
        jq -n --arg body "$body" --arg url "$RUN_URL" --arg trigger "$TRIGGER" --arg sha "${SHA:0:7}" \
          --arg title "${title:-Nightly sims failed}" --argjson colour "${colour:-15158332}" \
          '{username: "Nightly sims", embeds: [{title: $title, url: $url, color: $colour, description: $body, footer: {text: ("\($trigger) · \($sha)")}}]}' > /tmp/discord.json

        if [ -z "$DISCORD_WEBHOOK" ]; then
          if [ "$HAVE_VAR" = "true" ]; then
            echo "FOUND IT: DISCORD_WEBHOOK is a repository VARIABLE, not a secret. Delete it from"
            echo "the Variables tab and add it under Secrets. It matters on a public repository:"
            echo "GitHub masks a secret in these logs and does not mask a variable, so a failing"
            echo "curl could print the URL into a log anybody can read."
          else
            echo "DISCORD_WEBHOOK is empty, and there is no repository variable of that name"
            echo "either. So it is not on this repository's Actions secrets at all - check it is"
            echo "on coreysho/DeathPlateau-Engine, under the Actions tab (not Dependabot or"
            echo "Codespaces), as a Repository secret (not an Environment secret)."
          fi
          echo "Nothing was posted. The message would have been:"
          cat /tmp/discord.json
          exit 0
        fi
        curl --silent --show-error --fail-with-body \
          -H 'Content-Type: application/json' \
          --data @/tmp/discord.json \
          "$DISCORD_WEBHOOK"
        echo "posted to Discord"
